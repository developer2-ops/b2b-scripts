VzTLJm53/?utm_source&#x3D;ig_embed&amp;amp;utm_campaign&#x3D;loading\&quot; style&#x3D;\&quot; color:#c9c8cd; font-family:Arial,sans-serif; font-size:14px; font-style:normal; font-weight:normal; line-height:17px; text-decoration:none;\&quot; target&#x3D;\&quot;_blank\&quot;&gt;A post shared by 주는사란 (자기계발, 창업, 사업, 마케팅) (@ran0220)&lt;/a&gt;&lt;/p&gt;&lt;/div&gt;&lt;/blockquote&gt;\n&lt;script async src&#x3D;\&quot;//platform.instagram.com/en_US/embeds.js\&quot;&gt;&lt;/script&gt;&quot;, "originalWidth" : "658", "originalHeight" : "", "contentMode" : "normal", "description": &quot;2 Likes, 1 Comments - 주는사란 (자기계발, 창업, 사업, 마케팅) (@ran0220) on Instagram: \&quot;&lt;#주는사란 의 #돈 버는 #생각 2&gt; \&quot;고객이 전화를 받을 수 없어~\&quot; 이 말을 ...\&quot;&quot;, "inputUrl": "https://www.instagram.com/p/CqZVzTLJm53/?utm_source&#x3D;ig_web_copy_link", "thumbnailUrl" : "https://scontent.cdninstagram.com/v/t51.2885-15/338194958_223163597043526_8206900015344925013_n.jpg?stp&#x3D;dst-jpg_e35_s640x640_sh0.08&amp;_nc_ht&#x3D;scontent.cdninstagram.com&amp;_nc_cat&#x3D;110&amp;_nc_ohc&#x3D;uoKTTSENg3gAX8ta-xA&amp;edm&#x3D;AMO9-JQAAAAA&amp;ccb&#x3D;7-5&amp;oh&#x3D;00_AfD0iV8uvB3hJUL5H5trviUkT6bE4yI3oyLo5S-NxVboag&amp;oe&#x3D;64255B79&amp;_nc_sid&#x3D;b9f2ee", "thumbnailHeight" : "640", "thumbnailWidth" : "640", "title": &quot;Instagram의 주는사란 (자기계발, 창업, 사업, 마케팅)님 : \&quot;&lt;#주는사란 의 #돈 버는 #생각 2&gt; \&quot;고객이 전화를 받을 수 없어~\&quot; 이 말을 들을 때, #기분은 두 가지로 나뉜다. 70% 정도의 확률로 기분이 찜찜 할 것이다. 해야 할 말을 하지 못했기 때문이다. 하지만 나머지 30%정도는 안도감이 들 때도 있을것 이다. 해야 할 말을 전하기 싫을 때도 있으니까 말이다. 상대방이 안 받아주니 얼마나 다행인가. \&quot;나는 할만큼 했어\&quot;라는 #합리화 도 할 수 있게 된다. 이번엔 반대로 생각해보자. 누군가에게 연락이 올 때의 기분도 두 가지로 나뉜다. 30% 정도의 확률로 신이 난다. 기다리던 연락이 왔기 때문이다. 하지만 나머지 70%정도는 내가 원하는 연락이 아닐 것이다. 왜냐면 전화를 받는다는건 수동적이기 때문이다. 그러니 당연히 내가 먼저 연락을 하는 것에 비해 내 기분은 별로일 것이다. 물론 수동적이라고 하면 당신은 이렇게 반박 할 수도 있다. \&quot;전화를 안 받으면 되잖아?\&quot; 그러나 스팸이 아닌 이상 전화를 받지 않았을 때, 아니 받지 못했을 때를 생각해보라. 상대방에게 &#x27;왜 전화를 안 받았는지&#x27; 핑계 거리를 생각해야 한다. 아쉽게도 생각보다 세상에는 전화를 못 받았을 때 말할 #핑계 거리가 없다. 운영했던 수학학원을 #홍보 하는 #블로그 때문에, 아직까지도 최소 하루 3통씩 수업 문의가 온다. 처음에는 이 전화가 신이 났다. 내가 블로그를 잘 썼다는 증거니까. 이 전화 3통에는 기분 그 이상의 의미가 있다. 4개월 전 학원을 중단해야겠다는 생각을 했을 때 너무 #불안 했다. 아니 아직도 불안하다. 10년간 내 사업 인생을 돌아봤을 때, 내게 학원만 한 게 없었고, 결국 다시 학원으로 돌아갔으니깐. 그래서 하루 3통의 전화는 \&quot;세란아 너가 하려는게 잘 안되도 걱정마~ 내(학원)가 있잖아\&quot; 라고 말해주는듯 했다. 그래서 이 핑계 저 핑계되며 블로그를 내리지 않았고, 매일같이 위로를 받았다. 하지만 이 전화가 꽤 종종 나를 귀찮게 하기도 한다. 지난주에 블로그 강의를 하고 있는데 수업 문의가 왔다. 한번 전화를 거절했는데, 한 시간마다 전화와 문자를 보냈다. 꼭 수업을 받아보고 싶다고 했다. 죄송하지만 뻔히 상상되는 그런 핑계를 대며 수업을 거절했다. 거절은 했지만 이 전화를 받으며 아주 조금 흔들렸다. \&quot;아 진짜 그냥 얘만 맡아볼까?\&quot; 이렇듯 내게 오는 전화는 위로와 귀찮음의 경계를 넘나든다. 그리고 높은 확률로 귀찮음이 더 클 것이다. 내 상황을 고려해서 전화가 오는건 아니니까. 내가 거는 전화는 어떨까? 상대방이 받지 않으면 기분은 찜찜하다. 그러나 높은 확률로 상대방은 내게 다시 연락이 올테고, 그럼 내 찜찜한 기분은 곧 사라진다. 자 그럼 이제 우리는 선택해야 한다. 전화를 걸 것인가? 오는 전화를 받을 것인가? 이 글은 놀랍게도 &#x27;실행력&#x27;에 관한 글이다. 누군가는 매일 전화 건다.(실행을 한다) 물론 그 순간에는 답이 없을 수도 있다.(성과가 안 날 수도 있다) 전화 받는 사람이 지금 바쁠수도 있으니까.(레벨이 부족한걸 수도, 운이 나빴을 수도 있다) 하지만 높은 확률로 다시 연락이 올것이다.(반드시 레벨업 한다) 물론 그 연락은 세상에 거의 없는 뻔한 핑계와 함께 일수도 있다. (아주 조금의 레벨업 일지 모른다) 그러나 실망할 필욘 없다. 받는 사람의 상황과 내 전화의 시기가 맞을때 제대로된 통화를 할수 있을거다. (성과가 날것이다) 여러분은 오늘 어떤 전화를 할건지 댓글로 써주세요.\&quot;&quot;, "providerUrl": "https://www.instagram.com/", "align": "", "type" : "rich" }}'></script>
